name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          DIR="memorypool-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "${DIR}"
          cp "target/${{ matrix.target }}/release/memorypool" "${DIR}/"
          cp README.md LICENSE "${DIR}/"
          tar czf "memorypool-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" "${DIR}"
      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $dir = "memorypool-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/memorypool.exe" $dir
          Copy-Item README.md, LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "memorypool-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip"
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            memorypool-*.tar.gz
            memorypool-*.zip

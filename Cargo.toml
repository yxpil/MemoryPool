[package]
name = "memorypool"
version = "0.1.0"
edition = "2021"
description = "Shared, persistent memory pool for AI agents around the BIT ecosystem"
license = "Apache-2.0"
repository = "https://github.com/yxpil/MemoryPool"
keywords = ["ai", "agent", "memory", "bit", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "memorypool"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
ureq = { version = "2", features = ["json"] }
